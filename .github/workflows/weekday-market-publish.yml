name: weekday-market-data

# Phase 3I.2 cut-over (approved 2026-10-14): this workflow now ALSO runs on a schedule (it was manual-only until then, and the daily data stopped refreshing on 2026-10-08).
# Slots come from mitw/daily.py (GitHub cron is UTC; Taiwan has no DST, UTC+8):
#   CRON_UTC                 21:00 / 22:00 / 23:00 Taipei, Mon-Fri   (TPEx primary / retry / final)
#   MORNING_CRON_UTC         06:30 Taipei, Mon-Sat                   (TWSE)
#   SATURDAY_RETRY_CRON_UTC  07:30 / 08:30 Taipei Saturday           (TWSE only; zero requests when nothing is owed)
# Every run is idempotent: when nothing is owed the precheck returns NOOP with zero requests. The legacy weekly workflow (weekly-publish.yml) is untouched.
# TWSE / TPEx publication under the DAILY_TRADING_DAY policy. 興櫃 has its own workflow and its own failure domain (still manual-only).
on:
  schedule:
    - cron: "0 13 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "30 22 * * 0-5"
    - cron: "30 23 * * 5"
    - cron: "30 0 * * 6"
  workflow_dispatch:
    inputs:
      force_market:
        description: "Also query this market even if the Last Known Good already meets its target (it is still judged against its OWN target date)."
        type: choice
        options: ["none", "TWSE", "TPEX", "both"]
        default: "none"
      republish:
        description: "EXPLICIT EXCEPTION: publish although no market is newer than the published release (recorded in the manifest gate)."
        type: boolean
        default: false

# A separate group from the 興櫃 workflow: neither can queue behind, replace or cancel the other. Data-branch safety does NOT rely on this:
# `mitw.cli push-paths` itself fetches, stages explicit paths only, reconciles a DISJOINT remote move, fails closed on an overlapping one,
# never forces, and verifies the remote head after pushing.
concurrency:
  group: market-data-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  PAGES_URL: https://ifayu.github.io/yichuang-market-data
  TZ: Asia/Taipei

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pipeline (main)
        uses: actions/checkout@v4

      - name: Checkout the published data (branch `data` = what GitHub Pages serves) into out/
        uses: actions/checkout@v4
        with:
          ref: data
          path: out

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -t .

      # Best-effort cache of the raw partitions: a market that owes nothing is CARRIED from the partition its Last Known Good was built from (no request).
      # A cache miss only costs requests (that market is fetched instead); it can never make a number wrong.
      - name: Restore the raw cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: market-raw-${{ github.run_id }}
          restore-keys: market-raw-

      - name: Run the daily pipeline (precheck -> owed markets only -> per-market targets -> gate -> atomic release)
        id: run
        shell: bash
        run: |
          set +e
          FORCE=""
          case "${{ inputs.force_market }}" in TWSE) FORCE="--force-market TWSE";; TPEX) FORCE="--force-market TPEX";; both) FORCE="--force-market TWSE TPEX";; esac
          python -m mitw.cli run-daily --trigger ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }} ${{ inputs.republish && '--republish' || '' }} $FORCE | tee decision.json
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("decision.json"))
          print("### TWSE / TPEx daily:", d["state"])
          print(d.get("failureReason") or "")
          PY

      - name: Save the raw cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: market-raw-${{ github.run_id }}

      # Order is the contract: immutable release first -> public read-back of every file -> (health: publicVerification) -> manifest.json LAST.
      # Any failure before the manifest push leaves the live manifest, and therefore what every visitor sees, exactly as it was.
      - name: Publish (release first, manifest last)
        shell: bash
        run: |
          set -uo pipefail
          RC="${{ steps.run.outputs.rc }}"
          GUARD="--guard manifest.json --guard health.json --guard releases/"
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- manifest.json)" ]; then
            REL=$(python -c "import json;print(json.load(open('manifest.json'))['release'])")
            echo "new release $REL"
            cd ..
            python -m mitw.cli push-paths --repo out --branch data --path releases $GUARD --message "release $REL (immutable; not live until manifest.json points at it)" || exit 7
            if python -m mitw.cli verify-remote --base "$PAGES_URL" --release "$REL" --timeout 900; then
              python -m mitw.cli mark-verified --release "$REL"
              python -m mitw.cli push-paths --repo out --branch data --path manifest.json --path health.json $GUARD --message "publish $REL" || exit 7
            else
              (cd out && git checkout HEAD -- manifest.json)
              python -m mitw.cli mark-failed --reason "release $REL could not be read back from the public site; manifest.json was NOT updated"
              python -m mitw.cli push-paths --repo out --branch data --path health.json $GUARD --message "health: release $REL not readable, manifest unchanged" || true
              RC=1
            fi
          else
            cd ..
            # Nothing new to publish: close any PENDING_PUBLIC_READBACK the live release still carries (health.json only; a failure here never touches the live release)
            python -m mitw.cli reconcile-health --base "$PAGES_URL" || true
            python -m mitw.cli push-paths --repo out --branch data --path health.json $GUARD --message "health: run record" || true
          fi
          exit "${RC:-0}"
